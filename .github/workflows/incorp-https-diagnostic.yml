name: IncorpCycle HTTPS certificate and icon validation
on:
  push:
    paths:
      - .github/workflows/incorp-https-diagnostic.yml
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  https:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check certificate and enforce HTTPS when available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
          response=$(curl -sS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$url")
          echo "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); print({k:d.get(k) for k in ("cname","status","https_enforced","https_certificate","html_url")})'
          state=$(echo "$response" | python3 -c "import sys,json; print((json.load(sys.stdin).get('https_certificate') or {}).get('state','missing'))")
          enforced=$(echo "$response" | python3 -c "import sys,json; print(str(json.load(sys.stdin).get('https_enforced')).lower())")
          if [ "$enforced" = true ]; then
            echo "HTTPS already enforced"
          elif [ "$state" = approved ] || [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "Attempting GitHub Pages HTTPS enforcement; certificate=$state"
            code=$(curl -sS --max-time 20 -o /tmp/https-result.txt -w '%{http_code}' -X PUT -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d '{"https_enforced":true}' "$url")
            echo "GitHub Pages HTTPS enforcement HTTP status: $code"
            head -c 700 /tmp/https-result.txt || true
            echo
          else
            echo "Certificate not approved yet. Will check at next scheduled run."
          fi
          echo "Verifying public HTTPS certificate for www.incorpcycle.com:"
          curl -sS -I --max-time 12 'https://www.incorpcycle.com/' | head -n 4 || true
          echo "Verifying favicon HTTP response:"
          curl -k -sS -I --max-time 12 'https://www.incorpcycle.com/favicon.png' | head -n 5 || true
