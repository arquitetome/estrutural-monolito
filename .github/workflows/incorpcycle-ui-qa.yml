name: IncorpCycle - QA das vistas 3D e interface
on:
  push:
    paths:
      - "index.html"
      - "pragma-bim.html"
      - "pragma-bim.js"
      - ".github/workflows/incorpcycle-ui-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe dos scripts e integridade do layout
        shell: bash
        run: |
          python3 - <<'PY'
          import re,subprocess,pathlib,sys
          s=pathlib.Path('index.html').read_text()
          checks={
            'model floor shifts left': bool(re.search(r"if\(g\.name==='floor-detail'\)\{[^}]*mat\[12\]-=[0-9.]+\*d",s)),
            'site has architecture variants': all(x in s for x in ["if(type==='studios'){w=10.5", "if(type==='hotel'){w=19.2", "if(type==='comercial'){w=18.8", "if(type==='misto'){w=f===0?24"]),
            'dirt rural roads': "Circulações de chácaras: caminhos rurais" in s,
            'rural streetlights switch with night': 'diffuser=[1.00,.90,.72,.20,2.35]' in s and 'float switched=smoothstep(.35,.72,uNight)' in s,
            'roadway lighting enabled in both subdivisions': 'uParcelRoad,state.type===\x27loteamento\x27?1:state.type===\x27chacaras\x27?2:0' in s,
            'desmembramento has no new light poles': 'if(!split){' in s and 'function streetPole(x,z,axis)' in s,

            'fullscreen controls separated': ".game-surface .game-exit{top:59px" in s,
            'PRAGMA BIM federated viewer': 'pragma-bim-iframe' in s and pathlib.Path('pragma-bim.html').exists() and pathlib.Path('pragma-bim.js').exists(),
            'favicons present': pathlib.Path('favicon.ico').exists() and pathlib.Path('favicon.png').exists(),
            'humanized plan preserved': 'const APPROVED_PLAN=' in s,
            'no second darkening in hero cycle': 'arch.state.night=.18;arch.redraw();},13250' in s and 'arch.animate({night:1},540);},13580' not in s
          }
          for k,v in checks.items(): print(('PASS' if v else 'FAIL')+' '+k)
          if not all(checks.values()):sys.exit(1)
          scripts=re.findall(r'<script\b([^>]*)>(.*?)</script>',s,re.S|re.I)
          count=0
          for attrs,code in scripts:
            if re.search(r'\btype\s*=\s*["\x27](?:text/plain|application/ld\+json)',attrs,re.I) or not code.strip():continue
            if re.search(r'\bsrc\s*=',attrs,re.I):continue
            path=pathlib.Path('/tmp/incorp-check.js')
            path.write_text(code)
            chk=subprocess.run(['node','--check',str(path)],capture_output=True,text=True)
            if chk.returncode:
              print('ERROR on script',count,attrs[:100],chk.stderr[:2000]);sys.exit(1)
            count+=1
          print('PASS JS syntax, script blocks:',count)
          p=subprocess.run(['node','--check','pragma-bim.js'],capture_output=True,text=True)
          if p.returncode:
            print('FAIL PRAGMA BIM module:',p.stderr[:2200]);sys.exit(1)
          print('PASS PRAGMA BIM viewer JS syntax')
          PY
      - name: Testar WebGL 3D, seleção de andares, painel BIM e gamificação
        shell: bash
        run: |
          command -v google-chrome || true
          npm install --no-save --no-package-lock playwright@1.56.1
          python3 -m http.server 8055 --bind 127.0.0.1 >/tmp/incorp-http.log 2>&1 &
          sleep 2
          cat >/tmp/incorp-browser-qa.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const exe=process.env.CHROME_BIN||'/usr/bin/google-chrome';
            const browser=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--enable-unsafe-swiftshader']});
            const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>{errors.push(String(e.message));console.log('PAGEERROR',e.message)});
            await page.goto('http://127.0.0.1:8055/index.html',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForFunction(()=>window.incorpDebug?.architecture||document.querySelector('.scene-host')?.classList.contains('no-webgl'),{timeout:35000});
            console.log('HOME',await page.evaluate(()=>({has3d:!!window.incorpDebug?.architecture,rendered:document.querySelector('.scene-host canvas')?.dataset.rendered,chapter:document.querySelector('#main')?.dataset.chapter})));
            await page.screenshot({path:'/tmp/incorp-home.png'});
            // QA do loop: iluminação decorativa no começo e cena clara (night=.18) no estágio parado, até o carro sair.
            const heroLightBefore=await page.evaluate(()=>({night:window.incorpDebug?.architecture?.state.night,build:window.incorpDebug?.architecture?.state.build}));
            console.log('HERO LIGHT BEFORE',JSON.stringify(heroLightBefore));
            await page.evaluate(()=>{
              window.__heroTrace=[];
              const start=performance.now();
              window.__heroTraceTimer=setInterval(()=>{
                const a=window.incorpDebug?.architecture?.state;
                window.__heroTrace.push({elapsed:Math.round(performance.now()-start),
                  hidden:document.hidden,chapter:document.querySelector('#main')?.dataset.chapter,
                  build:a?.build,structure:a?.structure,crane:a?.crane,night:a?.night});
                if(window.__heroTrace.length>35)clearInterval(window.__heroTraceTimer);
              },1000);
            });
            try{
              await page.waitForFunction(()=>{
                const a=window.incorpDebug?.architecture?.state;
                return !!a&&a.night>=.16&&a.night<=.21&&a.build>.96&&a.crane<.08;
              },null,{timeout:23000});
            }catch(e){
              const diagnostics=await page.evaluate(()=>({
                state:window.incorpDebug?.architecture?.state,
                trace:window.__heroTrace,hidden:document.hidden,
                visibility:document.visibilityState,chapter:document.querySelector('#main')?.dataset.chapter,
                paused:document.querySelector('#gesture-hint')?.hidden
              }));
              console.log('HERO LIGHT DIAGNOSTICS',JSON.stringify(diagnostics));
              throw e;
            }
            const heroLightAfter=await page.evaluate(()=>({
              night:window.incorpDebug?.architecture?.state.night,
              build:window.incorpDebug?.architecture?.state.build,
              crane:window.incorpDebug?.architecture?.state.crane
            }));
            console.log('HERO LIGHT AFTER',JSON.stringify(heroLightAfter));
            await page.screenshot({path:'/tmp/incorp-home-lights-on.png'});
            // Nova cena: carro percorre a rua frontal da direita para a esquerda
            // quando o edifício já está parado; o loop continua com 21 segundos.
            await page.waitForFunction(()=>{
              const a=window.incorpDebug?.architecture?.state;
              return a?.heroCarActive===1&&a.heroCarTravel>.12&&a.heroCarTravel<.92;
            },null,{timeout:17000});
            const carStart=await page.evaluate(()=>({
              progress:window.incorpDebug.architecture.state.heroCarTravel,
              night:window.incorpDebug.architecture.state.night,
              active:window.incorpDebug.architecture.state.heroCarActive
            }));
            await page.screenshot({path:'/tmp/incorp-home-car-moving.png'});
            await sleep(450);
            const carMoving=await page.evaluate(()=>window.incorpDebug.architecture.state.heroCarTravel);
            if(carStart.active!==1||Math.abs(carStart.night-.18)>.045||carMoving<carStart.progress+.018)
              throw new Error('Car must move while the scene remains bright');
            await page.waitForFunction(()=>{
              const a=window.incorpDebug?.architecture?.state;
              return a?.heroCarActive===0&&a.heroCarTravel>.985;
            },null,{timeout:9000});
            if(Math.abs(await page.evaluate(()=>window.incorpDebug.architecture.state.night)-.18)>.045)throw new Error('The scene darkened again before the end of the loop');
            console.log('PASS HERO CAR',JSON.stringify({entered:carStart.progress,advanced:carMoving,
              exited:await page.evaluate(()=>window.incorpDebug.architecture.state.heroCarTravel),
              lights:carStart.night,loopMs:21000}));
            await page.screenshot({path:'/tmp/incorp-home-car-exited.png'});
            await page.evaluate(()=>window.incorpDebug.goChapter(1));
            const types=['residencial','misto','studios','hotel','comercial','chacaras','casas','logistico','multi'];
            for(const type of types){
              await page.evaluate(t=>window.incorpDebug.changeVariant(t),type);
              await sleep(140);
              console.log('TYPE',type,await page.evaluate(()=>({type:window.incorpDebug.architecture?.state.type,stats:window.incorpDebug.architecture?.stats()})));
              if(['residencial','misto','studios','hotel','comercial','chacaras'].includes(type))await page.screenshot({path:'/tmp/incorp-'+type+'.png'});
            }
            await page.evaluate(()=>window.incorpDebug.changeVariant('residencial'));
            const noSelector=await page.locator('#floor-select, .floor-explorer, #floor-offset').count();
            if(noSelector!==0)throw new Error('Legacy floor selector box must be absent');
            await page.locator('[data-action="explode"]').click();
            await sleep(1350);
            const markers=page.locator('.floor-number-overlay [data-floor-number]');
            const count=await markers.count();
            const markerData=await page.evaluate(()=>{
              const list=[...document.querySelectorAll('.floor-number-overlay [data-floor-number]')];
              const root=document.querySelector('.floor-number-overlay');
              return {visible:!!root&&!root.hidden,numbers:list.map(x=>x.textContent.trim()),
                positions:list.map(x=>({x:x.getBoundingClientRect().left,y:x.getBoundingClientRect().top,within:!!x.getClientRects().length}))};
            });
            console.log('FLOOR MARKERS',JSON.stringify(markerData));
            if(count!==8||!markerData.visible||markerData.positions.some(p=>!p.within||!Number.isFinite(p.x)||!Number.isFinite(p.y)))
              throw new Error('Floor numbers must be visible, positioned and clickable after separating');
            await page.screenshot({path:'/tmp/incorp-floor-markers.png'});
            await page.locator('[data-floor-number="3"]').click();
            await page.waitForFunction(()=>window.incorpDebug?.architecture?.state?.floorSlide>.8,{timeout:18000});
            const selected=await page.evaluate(()=>({
              selected:window.incorpDebug.architecture?.state.selectedFloor,
              slide:window.incorpDebug.architecture?.state.floorSlide,
              active:document.querySelector('[data-floor-number="3"]')?.getAttribute('aria-pressed')
            }));
            console.log('FLOOR SELECTED',selected);
            if(selected.selected!==3||selected.slide<.8||selected.active!=='true')
              throw new Error('Floor 04 did not open to the left');
            await page.screenshot({path:'/tmp/incorp-floor-left.png'});
            await page.locator('[data-floor-number="3"]').click();
            await page.waitForFunction(()=>window.incorpDebug?.architecture?.state?.floorSlide<.2,{timeout:18000});
            const returned=await page.evaluate(()=>({selected:window.incorpDebug.architecture?.state.selectedFloor,slide:window.incorpDebug.architecture?.state.floorSlide}));
            if(returned.selected!==-1||returned.slide>.2)throw new Error('Selected floor should return to separated stack');
            await page.locator('[data-action="explode"]').click();
            const hidden=await page.locator('.floor-number-overlay').evaluate(x=>x.hidden);
            if(!hidden)throw new Error('Floor numbers should disappear when floors rejoin');
            await page.evaluate(()=>window.incorpDebug.goChapter(4));
            await sleep(800);
            await page.locator('iframe.pragma-bim-iframe').waitFor({state:'visible',timeout:20000});
            await page.waitForFunction(()=>{
              const iframe=document.querySelector('.pragma-bim-iframe');
              const doc=iframe?.contentDocument;
              return !!doc?.querySelector('#bimCanvas')&&!!doc?.querySelector('#cutRange')&&!!doc?.querySelector('.pbimLayers');
            },null,{timeout:30000});
            const bim=await page.evaluate(()=>{
              const x=document.querySelector('#work-content[data-module="projects"]'),
                iframe=document.querySelector('#incorp-bim-persistent-portal .pragma-bim-iframe'),
                d=iframe?.contentDocument,cut=d?.querySelector('#cutRange'),ir=iframe?.getBoundingClientRect(),
                cr=cut?.getBoundingClientRect();
              return {found:!!iframe,hasArchitecture:!!d?.querySelector('[data-layer="arch"]'),
                layers:d?.querySelectorAll('[data-layer]').length,foundCut:!!cut,
                hasNavigation:!!d?.querySelector('#bimCanvas'),
                hasFullscreen:!!d?.querySelector('#pbimFsBtn'),
                overflow:x?getComputedStyle(x).overflowY:null,
                cutFits:!!ir&&!!cr&&cr.top>=0&&cr.bottom<=ir.height+5};
            });
            console.log('PRAGMA BIM FEDERADO',JSON.stringify(bim));
            if(!bim.found||!bim.hasArchitecture||bim.layers<8||!bim.foundCut||!bim.hasNavigation||!bim.hasFullscreen||bim.overflow!=='hidden')
              throw new Error('The live PRAGMA BIM viewer, its disciplines or its cutting controls are missing');
            try{
              await page.waitForFunction(()=>{
                const d=document.querySelector('.pragma-bim-iframe')?.contentDocument,
                  t=d?.getElementById('bimLoadText')?.textContent||'';
                return t.includes('Visualização pronta')||t.includes('Falha')||t.includes('Não foi possível');
              },null,{timeout:85000});
            }catch(e){
              console.log('PRAGMA BIM LOAD TIMEOUT',await page.evaluate(()=>{
                const doc=document.querySelector('.pragma-bim-iframe')?.contentDocument;
                return {loadText:doc?.getElementById('bimLoadText')?.textContent,progress:doc?.getElementById('bimProgressNumber')?.textContent};
              }));
              throw e;
            }
            const loadState=await page.evaluate(()=>{
              const doc=document.querySelector('.pragma-bim-iframe')?.contentDocument;
              return {text:doc?.getElementById('bimLoadText')?.textContent,progress:doc?.getElementById('bimProgressNumber')?.textContent};
            });
            console.log('PRAGMA BIM LOAD',JSON.stringify(loadState));
            if(!loadState.text?.includes('Visualização pronta'))throw new Error('PRAGMA BIM model did not load: '+loadState.text);
            await page.screenshot({path:'/tmp/incorp-projects.png'});
            // Persistência real: sair de Projetos e voltar não cria outro iframe nem recarrega o BIM.
            await page.evaluate(()=>{
              window.__qaBimFrame=window.ICBimDebug?.iframe;
              if(window.__qaBimFrame?.contentWindow)window.__qaBimFrame.contentWindow.__qaBimLoadedOnce=true;
            });
            await page.evaluate(()=>window.incorpDebug.goChapter(4,{work:'marketing'}));
            await page.evaluate(()=>window.incorpDebug.goChapter(4,{work:'projects'}));
            await page.locator('iframe.pragma-bim-iframe').waitFor({state:'visible',timeout:20000});
            const persisted=await page.evaluate(()=>(
              window.__qaBimFrame===window.ICBimDebug?.iframe &&
              window.ICBimDebug?.created===1 &&
              window.ICBimDebug?.visible &&
              window.__qaBimFrame?.contentWindow?.__qaBimLoadedOnce===true
            ));
            console.log('INCORP BIM PERSISTENTE',persisted);
            if(!persisted)throw new Error('BIM reloaded after switching work tabs');
            await page.evaluate(()=>window.incorpDebug.goChapter(3));
            await page.locator('[data-delivery="6"]').click();
            await sleep(650);
            await page.locator('[data-ic="game-start"]').click();
            const controls=await page.evaluate(()=>{const fs=document.querySelector('.game-surface .media-fullscreen').getBoundingClientRect(),pause=document.querySelector('.game-surface .game-exit').getBoundingClientRect();return {fullscreenTop:fs.top,fullscreenBottom:fs.bottom,pauseTop:pause.top,overlap:!(pause.top>=fs.bottom||fs.top>=pause.bottom||pause.left>=fs.right||pause.right<=fs.left)}});
            console.log('GAME',JSON.stringify(controls));
            if(controls.overlap)throw new Error('Game buttons overlap');
            await page.screenshot({path:'/tmp/incorp-game.png'});
            await page.evaluate(()=>window.incorpDebug.goChapter(0));
            await page.evaluate(()=>document.querySelector('button.nav-start')?.click());
            const land=await page.evaluate(()=>{
              const sheet=document.getElementById('sheet'),body=document.getElementById('sheet-body');
              return {open:!!sheet?.open,title:document.getElementById('sheet-title')?.innerText,
                cards:sheet?.querySelectorAll('.terrain-card-v2').length,
                preserved:!!sheet?.querySelector('[data-land-route="owner"]')&&
                  !!sheet?.querySelector('[data-terrain-map="patos"]')&&
                  !!sheet?.querySelector('[data-terrain-map="auctions"]'),
                portfolio:!!sheet?.querySelector('.local-portfolio'),
                disclaimer:body?.innerText?.includes('O mapa de imobiliárias e o mapa de leilões continuam separados.'),
                topTerrain:[...document.querySelectorAll('.top-nav button,#mobile-menu button')]
                  .some(b=>b.textContent.trim()==='Terreno')};
            });
            console.log('INCORP COMEÇAR TERRRENO',JSON.stringify(land));
            if(!land.open||!land.title?.includes('Toda oportunidade tem um começo.')||
              !land.title?.includes('Qual seu ponto de partida?')||
              land.cards!==3||!land.preserved||land.portfolio||land.disclaimer||land.topTerrain)
              throw new Error('Começar should show three terrain paths without session notices');
            if(errors.length)throw new Error('Page runtime errors: '+errors.join('; '));
            await browser.close();
            console.log('PASS BROWSER QA: home, car, variants, floor, projects, game');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          node /tmp/incorp-browser-qa.cjs
      - name: Salvar capturas técnicas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incorpcycle-qa-capturas
          path: /tmp/incorp-*.png
          if-no-files-found: ignore
          retention-days: 7
