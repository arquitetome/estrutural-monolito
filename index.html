.game-surface[data-game-active="true"] .game-hud{pointer-events:none}
.game-surface[data-game-active="false"] canvas{cursor:pointer}
.game-surface[data-game-active="true"] canvas{cursor:grab}

.game-surface[data-game-unavailable="true"] .game-gate,.game-surface[data-game-unavailable="true"] .game-touch,.game-surface[data-game-unavailable="true"] .game-hud,.game-surface[data-game-unavailable="true"] .game-exit{display:none}
