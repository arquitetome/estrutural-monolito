<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#191d24">
<title>Coordenação BIM · IncorpCycle</title>
<style id="incorpcycle-bim-clean-ui">
:root{color-scheme:dark;--blue:#0071e3;--ink:#edf4ff;--graphite:#191d24;--panel:#232b35;--line:#415366}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:0;overflow:hidden;background:var(--graphite);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #8ecaff;outline-offset:2px}
body>.panel.ar{width:100%;height:100dvh;min-height:0;max-height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding:5px;background:var(--graphite)}
.pbimLab{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,228px);gap:7px;flex:1 1 auto;width:100%;height:100%;min-width:0;min-height:0;max-height:100%;overflow:hidden}
.pbimCanvasWrap{position:relative;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;border-radius:13px;border:1px solid #394c60;background:#202832;isolation:isolate}
.pbimCanvas{width:100%;height:100%;display:block;background:#232b35;cursor:grab;touch-action:none}
.pbimCanvas:active{cursor:grabbing}
.pbimCanvas:focus-visible{outline:2px solid #8ecaff;outline-offset:-3px}
.pbimOrigin{position:absolute;left:15px;top:14px;z-index:7;padding:10px 13px;border-radius:10px;border:1px solid #47617b;background:rgba(14,21,31,.92);font-size:12px;font-weight:700;line-height:1.15;letter-spacing:.025em;color:#f4f8ff;pointer-events:none;box-shadow:0 6px 16px #0006}
.pbimFsBtn,.pragmaOrbitPauseBtn{position:absolute;right:12px;z-index:18;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;padding:0;border:1px solid #546e8a;background:rgba(19,30,45,.96);color:#f2f8ff;box-shadow:0 5px 17px #0006}
.pbimFsBtn{top:13px}
.pbimFsBtn svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none}
.pragmaOrbitPauseBtn{top:61px;font:700 16px/1 Arial,sans-serif}
.pbimFsBtn:hover,.pragmaOrbitPauseBtn:hover{background:#24538a}
.pragmaOrbitPauseBtn.paused{background:var(--blue);border-color:#51abff}
.pbimLoad{position:absolute;inset:0;z-index:25;background:rgba(26,35,46,.98);display:grid;place-items:center;padding:20px;text-align:center;transition:opacity .4s ease;color:#ecf5ff}
.pbimLoad.hide{opacity:0;pointer-events:none}
.pragmaV27LoaderCard{width:min(290px,100%);padding:22px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.pragmaV27LoaderIcon{display:block;width:38px;height:38px;margin-bottom:8px;border:2px solid #40546b;border-top-color:var(--blue);border-radius:12px;animation:incorpSpinner 1.45s linear infinite}
@keyframes incorpSpinner{to{transform:rotate(360deg)}}
#bimLoadText{color:#f5f9ff;font-size:15px;font-weight:700;line-height:1.4}
.pragmaV27LoaderCaption{color:#b8c9df;font-size:11px;margin:0}
.pbimProgress{width:min(220px,100%);height:5px;border-radius:99px;overflow:hidden;background:#3b4e62}
.pbimProgress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0071e3,#4ba9ff);transition:width .2s ease}
.pragmaV27LoaderPercent{font-size:10px;color:#bdcee1}
.pbimView{position:absolute;left:50%;bottom:13px;right:auto;top:auto;z-index:20;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:4px;padding:4px;width:max-content;max-width:calc(100% - 20px);min-width:0;white-space:nowrap;border:1px solid #546b83;border-radius:999px;background:rgba(14,22,33,.97);box-shadow:0 8px 24px #0009}
.pbimView button{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;text-align:center;flex:0 1 auto;padding:10px 13px;min-width:0;min-height:37px;border-radius:999px;border:1px solid transparent;background:transparent;color:#edf3fc;font:650 11px/1.15 Arial,sans-serif;letter-spacing:0;text-shadow:none;box-shadow:none}
.pbimView button:hover:not([aria-pressed=true]){background:#334c67;color:#fff}
.pbimView button[aria-pressed=true],.pbimView button.is-active{color:#fff;background:var(--blue);border-color:#268cff;box-shadow:0 2px 10px #0071e35c}
.pbimLayers{display:flex;flex-direction:column;justify-content:space-between;gap:2px;min-width:0;min-height:0;max-height:100%;overflow:hidden;padding:7px 9px;border:1px solid #394c60;border-radius:13px;background:var(--panel);color:#edf4ff}
.pbimLayers h3{font:700 14px/1.18 Arial,sans-serif;margin:0 0 4px;color:#f5f9ff;flex:none}
.pbimLayers>.fine{display:none}
#layerRows{display:flex;flex-direction:column;justify-content:space-around;min-height:0;flex:1 1 auto;gap:1px}
.layer-row{display:flex;align-items:center;gap:6px;flex:1 1 auto;min-height:18px;max-height:28px;border-bottom:1px solid #374859}
.layer-row:last-child{border-bottom:0}
.layer-row label{position:relative;display:block;width:17px;height:17px;flex:none;cursor:pointer}
.layer-row input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.layer-row label i{display:grid;place-items:center;width:17px;height:17px;border:1px solid #718ca8;background:#1d2732;border-radius:5px;font-style:normal}
.layer-row label:has(input:checked) i{background:var(--blue);border-color:#3195ff}
.layer-row label:has(input:checked) i::after{content:"✓";color:white;font:700 11px/1 Arial,sans-serif}
.layer-row label:has(input:focus-visible) i{outline:2px solid #93cfff;outline-offset:2px}
.layer-name{flex:1;min-width:0;padding:4px 0;border:0;background:none;color:#dbe7f4;font:500 10px/1.15 Arial,sans-serif;text-align:left}
.layer-name:hover,.layer-name[aria-pressed=true]{color:#82c9ff;font-weight:700}
.layer-row[data-row=arch] .layer-name{color:#c2cbd8}
.layer-row[data-row=arch] input:not(:checked)~i{background:#1d2732;border-color:#718ca8}
.pbimExplain{flex:none;min-height:0;max-height:42px;overflow:hidden;padding:2px 0 3px}
.pbimExplain strong{display:block;font:700 10px/1.2 Arial,sans-serif;color:#eaf4ff}
.pbimExplain p{font:400 9px/1.25 Arial,sans-serif;color:#b8c8d8;margin:2px 0}
.pbimCut{flex:none;display:flex;flex-direction:column;gap:4px;padding-top:7px;margin-top:0;border-top:1px solid #40556b;color:#eaf2fe;font:650 10px/1.2 Arial,sans-serif}
.pbimCut input{width:100%;height:16px;margin:0;accent-color:var(--blue)}
.pbimCut small{font:400 9px/1.3 Arial,sans-serif;color:#b4c6d9}
.pragmaV27DragHand{position:absolute;z-index:12;display:flex;align-items:center;flex-direction:column;gap:5px;left:50%;top:51%;padding:6px 9px;transform:translate(-50%,-50%);color:white;background:transparent;border:0;box-shadow:none;isolation:isolate;pointer-events:none;text-align:center;font:650 11px/1.2 Arial,sans-serif;white-space:nowrap;text-shadow:0 3px 9px #000}
.pragmaV27DragHand::before{content:"";position:absolute;inset:-16px -28px;z-index:-1;pointer-events:none;border-radius:80%;background:radial-gradient(ellipse,rgba(0,0,0,.68),rgba(0,0,0,.30) 47%,transparent 80%);filter:blur(7px)}
.pragmaV27DragHand .incorpExactSwipeHand{display:block;width:27px;height:39px;object-fit:contain;filter:brightness(0) invert(1) drop-shadow(0 3px 5px #000)}
.pragmaV27DragHand span{color:#fff;text-shadow:0 3px 8px #000}
.pbimLab:fullscreen,.pbimLab:-webkit-full-screen,.pbimLab.pbimFullscreenFallback{position:fixed!important;inset:0!important;z-index:2147483600!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;min-height:0!important;margin:0!important;padding:7px!important;display:grid!important;grid-template-columns:minmax(0,1fr) minmax(212px,242px)!important;gap:7px!important;background:var(--graphite)!important;overflow:hidden!important}
.pbimLab:fullscreen .pbimCanvasWrap,.pbimLab.pbimFullscreenFallback .pbimCanvasWrap{height:100%;min-height:0}
@media(max-width:800px){
 body>.panel.ar{padding:4px}
 .pbimLab,.pbimLab:fullscreen,.pbimLab.pbimFullscreenFallback{display:flex!important;flex-direction:column!important;gap:5px!important;height:100%!important;min-height:0!important;overflow:hidden!important}
 .pbimCanvasWrap{flex:1 1 auto;height:auto;min-height:120px}
 .pbimLayers{flex:0 0 auto;height:auto;max-height:32vh;min-height:0;padding:5px 7px}
 #layerRows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 6px}
 .layer-row{min-height:24px;max-height:none;border-bottom:0;gap:3px}
 .layer-row label,.layer-row label i{width:14px;height:14px}
 .layer-name{font-size:9px;line-height:1.15;overflow-wrap:anywhere;white-space:normal}
 .pbimLayers h3{font-size:12px;margin:0}
 .pbimExplain{display:none}
 .pbimCut{grid-column:1/-1;min-height:32px;padding-top:4px;gap:2px}
 .pbimView{max-width:calc(100% - 14px);bottom:9px;gap:1px;padding:3px}
 .pbimView button{font-size:10px;min-height:33px;padding:8px 10px}
 .pbimOrigin{top:9px;left:9px;font-size:10px;padding:7px 10px}
 .pbimLab:fullscreen .pbimLayers,.pbimLab.pbimFullscreenFallback .pbimLayers{max-height:32vh!important}
}
@media(max-width:360px){
 .pbimView button{font-size:9px;padding:7px 8px}
 .pbimView{bottom:7px}
}
@media(max-height:500px) and (min-width:801px){
 .pbimExplain{display:none}
 .layer-row{min-height:15px;max-height:22px}
 .pbimView{bottom:7px}
 .pbimView button{min-height:30px;padding:7px 11px}
}
@media(prefers-reduced-motion:reduce){.pragmaV27LoaderIcon{animation:none}.pbimView button{transition:none}}
</style>
</head>
<body>
<section class="panel ar" aria-label="Coordenação BIM do IncorpCycle"></section>
<script type="module" src="./pragma-bim.js?v=20261009-r5"></script>
</body>
</html>
